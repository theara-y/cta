<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nearest Bus Stop Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Find Nearest Bus Stop</h1>
        <button id="find-btn">Locate Me</button>
		<p id="status"></p>
        <div id="result" class="hidden">
            <p><strong>Nearest Stop:</strong> <span id="stop-name">-</span></p>
            <p><strong>Distance:</strong> <span id="stop-dist">-</span> meters</p>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
